[project]
name = "expoal"
version = "2.5.4"
description = "Paste a link from YouTube, TikTok, Instagram or thousands of other sites and save the video to your own disk. 100% local, no third-party sites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Munir Torres" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # El extra curl-cffi no es un capricho: los extractores de TikTok e
    # Instagram piden hacerse pasar por un navegador en el saludo de la
    # conexión, y sin él yt-dlp avisa ("no impersonate target is available") y
    # pide la página a pelo, así que funciona hasta que la plataforma aprieta y
    # devuelve una página de relleno. Se pide POR EL EXTRA y no como dependencia
    # suelta para que sea yt-dlp quien fije el rango de versiones que sabe que
    # le funcionan (hoy >=0.5.10,<0.17 con varias excluidas).
    "yt-dlp[curl-cffi]>=2025.6.9",
    "pywebview>=5.1",
    "platformdirs>=4.2",
]

[project.scripts]
expoal = "expoal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expoal"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "pyinstaller>=6.21.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests no tocan la red ni los datos reales del usuario (ver
# tests/conftest.py): se pueden correr en cualquier momento sin sorpresas.
addopts = "-q"
