<svg xmlns="http://www.w3.org/2000/svg" width="520" height="651" viewBox="0 0 520 651" role="img" aria-label="Paste a link: Paste a link and Expoal reads the video, showing you the formats and resolutions it can actually pull. Pick a quality: Pick a quality, a container and a destination folder. Watch the queue: Once a download starts you get the queue: progress, speed and time left, a pause button that keeps what it already has, and a cancel button that stops it cleanly and leaves no half-written files behind. Find it on your disk: Finished downloads keep a folder button that opens the file where it landed, and the history below survives restarts."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#1475ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#f0f6fc">Paste a link</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">Paste a link and Expoal reads the</text><text x="80" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">video, showing you the formats and</text><text x="80" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#9198a1">resolutions it can actually pull.</text><path d="M32 68 V169" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M26 161 L32 169 L38 161" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 181) scale(2)"><path fill="none" stroke="#1475ff" stroke-linecap="round" stroke-line