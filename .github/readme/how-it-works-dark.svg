<svg xmlns="http://www.w3.org/2000/svg" width="960" height="245" viewBox="0 0 960 245" role="img" aria-label="Paste a link: Paste a link and Expoal reads the video, showing you the formats and resolutions it can actually pull. Pick a quality: Pick a quality, a container and a destination folder. Watch the queue: Once a download starts you get the queue: progress, speed and time left, a pause button that keeps what it already has, and a cancel button that stops it cleanly and leaves no half-written files behind. Find it on your disk: Finished downloads keep a folder button that opens the file where it landed, and the history below survives restarts."><g transform="translate(94 8) scale(2.1667)"><g fill="none" stroke="#1475ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g></g><text x="120" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Paste a link</text><text x="120" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Paste a link and Expoal</text><text x="120" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">reads the video.</text><path d="M166 34 H312" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M305 28 L314 34 L305 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(334 8) scale(2.1667)"><path fill="none" stroke="#1475ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M10 5H3m9 14H3M14 3v4m2 10v4m5-9h-9m9 7h-5m5-14h-7m-6 5v4m0-2H3"/></g><text x="360" y="100" text-anc